# BrainSait Developer Assistant
# Multi-agent system for software development

services:
  developer-agent:
    build:
      context: .
    ports:
      - 8080:8080
    environment:
      - MCP_SERVER_URL=http://mcp-gateway:8811/sse
    depends_on:
      - mcp-gateway
    volumes:
      - ./workspace:/workspace
    models:
      qwen3:
        endpoint_var: MODEL_RUNNER_URL
        model_var: MODEL_RUNNER_MODEL

  mcp-gateway:
    image: docker/mcp-gateway:latest
    use_api_socket: true
    command:
      - --transport=sse
      - --servers=github-official,filesystem,duckduckgo
      - --tools=search,read_file,write_file,list_directory
    secrets:
      - github-token
    environment:
      - GITHUB_PERSONAL_ACCESS_TOKEN_FILE=/run/secrets/github-token

models:
  qwen3:
    model: ai/qwen3:14B-Q6_K
    context_size: 32768
    runtime_flags:
      - --no-prefill-assistant

secrets:
  github-token:
    file: ./github_token
