# BrainSait SQL Analyst
# LangGraph-based natural language to SQL agent

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: analyst_password
      POSTGRES_DB: analytics
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - analytics_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U analyst -d analytics]
      interval: 5s
      timeout: 3s
      retries: 10

  agent:
    build: .
    ports:
      - 8080:8080
    environment:
      - MCP_SERVER_URL=http://mcp-gateway:8811/sse
      - DATABASE_DIALECT=PostgreSQL
    depends_on:
      database:
        condition: service_healthy
      mcp-gateway:
        condition: service_started
    models:
      qwen3:
        endpoint_var: MODEL_RUNNER_URL
        model_var: MODEL_RUNNER_MODEL

  mcp-gateway:
    image: docker/mcp-gateway:latest
    use_api_socket: true
    command:
      - --transport=sse
      - --secrets=/run/secrets/database-url
      - --servers=postgres
      - --tools=query
    secrets:
      - database-url

models:
  qwen3:
    model: ai/qwen3:14B-Q6_K
    context_size: 16384

secrets:
  database-url:
    file: ./postgres_url

volumes:
  analytics_data:
